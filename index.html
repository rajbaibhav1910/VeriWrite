<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="VeriWrite — understand the writing behind the words. Transparent, sentence-level AI detection plus paraphrasing, grammar, originality and research tools."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>VeriWrite — Understand the writing behind the words</title>
    <script>
      // Applied before paint so dark mode never flashes light.
      (function () {
        try {
          var stored = localStorage.getItem("vw.theme");
          var mode = stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
          var dark = mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
